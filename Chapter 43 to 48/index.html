    <style>
    body{
        font-family: Arial, sans-serif;
        background: linear-gradient(to right, #f4f6f9, #e3f2fd);
        text-align: center;
        margin: 0;
        padding: 20px;
    }

    /* Link Button */
    a{
        display: inline-block;
        margin: 15px;
        padding: 10px 25px;
        background-color: #007bff;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-weight: bold;
        transition: 0.3s;
    }

    a:hover{
        background-color: #0056b3;
        transform: scale(1.05);
    }

    /* All Images */
    img{
        height: 120px;
        margin: 15px;
        border-radius: 12px;
        cursor: pointer;
        transition: 0.3s;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    img:hover{
        transform: scale(1.1);
        box-shadow: 0 6px 15px rgba(0,0,0,0.3);
    }
</style>
